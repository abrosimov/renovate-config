name: release

# A tag is what the fleet actually extends, so it is the only thing that ships.
# The validator runs again here rather than being trusted from the pull request:
# a preset that cannot be resolved must never become a version repositories pin
# to, because a broken tag parks every consumer at once and cannot be moved
# afterwards without breaking the checkouts that already resolved it.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, as vMAJOR.MINOR.PATCH"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      # A tag cut from a topic branch would carry configuration that never
      # passed the push validation on master.
      - name: Refuse to release from anywhere but master
        if: github.ref != 'refs/heads/master'
        env:
          REF: ${{ github.ref }}
        run: |
          echo "::error::Release must run on master, got $REF"
          exit 1

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          # Tags are needed to reject a version that already exists.
          fetch-depth: 0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: lts/*

      - run: npx --yes --package renovate -- renovate-config-validator --strict default.json

      # The inputs are read through the environment rather than interpolated
      # into the script, so a version string cannot become shell.
      - name: Check the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like v1.2.3, got $VERSION"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "::error::Tag $VERSION already exists"
            exit 1
          fi

      - name: Tag and release
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "$VERSION"
          git push origin "$VERSION"
          gh release create "$VERSION" --title "$VERSION" --generate-notes --verify-tag
