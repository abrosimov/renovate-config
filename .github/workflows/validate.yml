name: validate

# A broken preset is not discovered here. It is discovered by every repository
# that extends it, as a configuration error on its dependency dashboard, with
# updates parked until somebody notices. This is the gate that keeps it local.

on:
  push:
    branches: [master]
  pull_request:
  # The preset is static; Renovate is not. Options get renamed and removed on
  # its majors, so the breakage arrives without a commit. The weekly run is
  # what catches that, and it is the reason the validator is not pinned.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  config:
    name: config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The newest Renovate, on the Node its engines field accepts; the action
      # explains why Node follows Renovate rather than the other way round.
      - uses: ./.github/actions/renovate
        id: renovate
      # The tests import Renovate's own package-rule matcher, so they judge the
      # policy by the engine that will apply it.
      - name: Test the policy against Renovate's rule engine
        env:
          RENOVATE_DIR: ${{ steps.renovate.outputs.dir }}
        run: node --test tests/*.test.mjs
      # --strict fails on anything the validator would otherwise only warn
      # about, deprecated options among it. WARNING: a file passed by path is
      # validated as a global configuration, which is a superset of the
      # repository options, so a self-hosted-only option would pass here and
      # still be rejected in a consumer. Option names, manager names, regexes
      # and the resolution of every preset in `extends` are checked either way,
      # and those are what actually break the fleet. It runs from the same
      # install as the tests, so both judge the preset by one Renovate.
      - name: Validate the preset
        env:
          RENOVATE_BIN: ${{ steps.renovate.outputs.bin }}
        run: '"$RENOVATE_BIN/renovate-config-validator" --strict default.json'

  # The one check the baseline ruleset from gh-repo-settings requires: it
  # stands for every job above, so the ruleset names a single check however
  # this workflow's jobs change.
  required:
    name: required
    if: always()
    needs: [config]
    runs-on: ubuntu-latest
    steps:
      - name: All jobs passed
        run: test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = false
